name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full_validation:
        description: Run maintenance and SMB validation
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: make verify test build
      - run: make integration-test
        if: matrix.go == '1.27.x'
      - name: Lint workflow
        if: matrix.go == '1.27.x'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Check dependency vulnerabilities
        if: matrix.go == '1.27.x'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-go-${{ matrix.go }}
          path: coverage.out
          if-no-files-found: ignore

  mutations:
    name: Ownership mutation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: true
      - run: make mutation-test

  image:
    name: Build driver image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: make image
      - run: docker save sqlite-csi:e2e -o driver-image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: driver-image
          path: driver-image.tar
          retention-days: 1

  kubernetes:
    name: Kubernetes ${{ matrix.kubernetes }} (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    needs: image
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: '1.35.8'
            backend: shared-directory
            artifact: kubernetes-1.35.8
            node-image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - kubernetes: '1.36.4'
            backend: shared-directory
            artifact: kubernetes-1.36.4
            node-image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - kubernetes: '1.36.4'
            backend: nfs
            artifact: nas-integration-1.36.4
            node-image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install test tools
        shell: bash
        run: |
          set -euo pipefail
          go install sigs.k8s.io/kind@v0.33.0
          tools=$(mktemp -d)
          cd "$tools"
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.19.0-linux-amd64.tar.gz
          mv linux-amd64/helm .
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl helm
          echo "$tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: driver-image
      - run: docker load -i driver-image.tar
      - run: make chart
      - name: Assert replica correctness and measure resource use
        if: matrix.kubernetes == '1.36.4' && matrix.backend == 'shared-directory'
        run: make benchmark
      - name: Exercise single-writer storage and clean movement
        if: matrix.backend == 'shared-directory'
        env:
          KIND_NODE_IMAGE: ${{ matrix.node-image }}
        run: make e2e
      - name: Exercise real NAS integration boundaries
        if: matrix.backend == 'nfs'
        env:
          KIND_NODE_IMAGE: ${{ matrix.node-image }}
        run: make nas-image nas-test
      - name: Upload Kubernetes logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: .e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  maintenance:
    name: Driver upgrade
    if: github.event_name == 'workflow_dispatch' || inputs.full_validation
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install test tools
        shell: bash
        run: |
          set -euo pipefail
          go install sigs.k8s.io/kind@v0.33.0
          tools=$(mktemp -d)
          cd "$tools"
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.19.0-linux-amd64.tar.gz
          mv linux-amd64/helm .
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl helm
          echo "$tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: driver-image
      - run: docker load -i driver-image.tar
      - run: make chart
      - name: Check out pinned upgrade baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 94832bcf35f0cb3159e9f7e51b9efad590c7c993 # v0.2.0-alpha.1
          path: maintenance-baseline
          persist-credentials: false
      - name: Exercise driver restart and upgrade
        env:
          KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
        run: |
          mv maintenance-baseline "$RUNNER_TEMP/sqlite-csi-baseline"
          docker build -t sqlite-csi:baseline "$RUNNER_TEMP/sqlite-csi-baseline"
          make maintenance-test BASELINE_REPO="$RUNNER_TEMP/sqlite-csi-baseline"
      - name: Upload maintenance logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintenance-1.36.4
          path: .e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  smb-changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_VALIDATION: ${{ inputs.full_validation }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch || "$FULL_VALIDATION" == true ]]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            if git diff --name-only "$BASE_SHA"...HEAD | grep -E '^(test/protocols/smb/|Makefile$|\.github/workflows/ci\.yml$)' > /dev/null; then
              echo 'relevant=true' >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -E '^(test/protocols/smb/|Makefile$|\.github/workflows/ci\.yml$)' > /dev/null; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          fi

  smb-protocol:
    needs: smb-changes
    if: needs.smb-changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Build SMB protocol image
        run: make smb-protocol-image
      - name: Run fixture guards and protocol cases
        run: make smb-protocol-test
      - name: Upload SMB protocol results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smb-protocol-results
          path: .e2e/artifacts/smb-protocol-*/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
