# Test-only NFSv4 server, independent of the Kubernetes worker containers.
NFS_CORE_PARAM {
    Protocols = 4;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}
NFSv4 {
    Lease_Lifetime = 10;
    Grace_Period = 10;
}
EXPORT {
    Export_Id = 1;
    Path = /export;
    Pseudo = /replicas;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    FSAL { Name = VFS; }
}
LOG { Default_Log_Level = WARN; }
