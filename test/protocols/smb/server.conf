[global]
  server role = standalone server
  server min protocol = SMB3_00
  log level = 1
  map to guest = never
[rw]
  path = /export
  read only = no
  guest ok = no
  valid users = smbtest
  force user = smbtest
[readonly]
  path = /export
  read only = yes
  guest ok = no
  valid users = smbtest
  force user = smbtest
