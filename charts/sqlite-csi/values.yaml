image: sqlite-csi:dev
pullSecret: ''
createBackingClaim: false
backingClaim: sqlite-csi-replicas
backingStorageClass: ''
backingSize: 20Gi
storageClass: sqlite-csi
controllerNodeSelector:
  kubernetes.io/os: linux
nodeSelector:
  sqlite.csi/enabled: 'true'
localPath: /var/lib/sqlite-csi-data
kubeletPath: /var/lib/kubelet
provisionerImage: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
attacherImage: registry.k8s.io/sig-storage/csi-attacher:v4.12.0
registrarImage: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
