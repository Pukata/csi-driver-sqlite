{{- if and .Values.failover .Values.failover.enabled }}
{{- fail "automatic failover was removed; migrate legacy HA volumes to the standard sqlite-csi StorageClass" }}
{{- end }}
{{- if .Values.createBackingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.backingClaim }}
  annotations: {helm.sh/resource-policy: keep}
spec:
  storageClassName: {{ required "set backingStorageClass to a shared RWX class" .Values.backingStorageClass }}
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: {{ .Values.backingSize }}}}
---
{{- end }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: sqlite.csi
spec:
  attachRequired: true
  podInfoOnMount: true
  fsGroupPolicy: None
  requiresRepublish: true
  volumeLifecycleModes: [Persistent]
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass }}
  annotations: {storageclass.kubernetes.io/is-default-class: 'false'}
provisioner: sqlite.csi
parameters:
  database: database.db
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: sqlite-csi-controller}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: sqlite-csi-node}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: sqlite-csi-controller}
rules:
  - apiGroups: ['']
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, delete, update, patch]
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update, patch]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [events]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes, csidrivers]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments, volumeattachments/status]
    verbs: [get, list, watch, create, delete, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: sqlite-csi-controller}
subjects: [{kind: ServiceAccount, name: sqlite-csi-controller, namespace: {{ .Release.Namespace }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sqlite-csi-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: sqlite-csi-state}
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: sqlite-csi-state}
subjects:
  - {kind: ServiceAccount, name: sqlite-csi-controller}
  - {kind: ServiceAccount, name: sqlite-csi-node}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sqlite-csi-state}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sqlite-csi-controller}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: sqlite-csi-controller}}
  template:
    metadata: {labels: {app: sqlite-csi-controller}}
    spec:
      serviceAccountName: sqlite-csi-controller
      {{- if .Values.pullSecret }}
      imagePullSecrets: [{name: {{ .Values.pullSecret }}}]
      {{- end }}
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 15}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 15}
      nodeSelector:
{{ toYaml .Values.controllerNodeSelector | indent 8 }}
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: driver
          image: {{ .Values.image | quote }}
          args:
            - --mode=controller
            - --namespace={{ .Release.Namespace }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
          volumeMounts:
            - {name: socket, mountPath: /csi}
            - {name: backing, mountPath: /replicas}
        - name: provisioner
          image: {{ .Values.provisionerImage }}
          args: [--csi-address=/csi/csi.sock, --leader-election, --timeout=120s, --extra-create-metadata]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: socket, mountPath: /csi}]
        - name: attacher
          image: {{ .Values.attacherImage }}
          args: [--csi-address=/csi/csi.sock, --leader-election, --timeout=120s]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: socket, mountPath: /csi}]
      volumes:
        - {name: socket, emptyDir: {}}
        - name: backing
          persistentVolumeClaim: {claimName: {{ .Values.backingClaim }}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: sqlite-csi-node}
spec:
  selector: {matchLabels: {app: sqlite-csi-node}}
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1}}
  template:
    metadata: {labels: {app: sqlite-csi-node}}
    spec:
      serviceAccountName: sqlite-csi-node
      {{- if .Values.pullSecret }}
      imagePullSecrets: [{name: {{ .Values.pullSecret }}}]
      {{- end }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      terminationGracePeriodSeconds: 120
      containers:
        - name: driver
          image: {{ .Values.image | quote }}
          args: [--mode=node, --namespace={{ .Release.Namespace }}, --kubelet-root={{ .Values.kubeletPath }}]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext: {privileged: true, runAsUser: 0}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 512Mi}}
          volumeMounts:
            - {name: socket, mountPath: /csi}
            - {name: kubelet, mountPath: {{ .Values.kubeletPath }}, mountPropagation: Bidirectional}
            - {name: local, mountPath: /var/lib/sqlite-csi}
            - {name: backing, mountPath: /replicas}
        - name: registrar
          image: {{ .Values.registrarImage }}
          args: [--csi-address=/csi/csi.sock, --kubelet-registration-path={{ .Values.kubeletPath }}/plugins/sqlite.csi/csi.sock]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          securityContext: {runAsUser: 0, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: socket, mountPath: /csi}
            - {name: registration, mountPath: /registration}
      volumes:
        - {name: socket, hostPath: {path: {{ .Values.kubeletPath }}/plugins/sqlite.csi, type: DirectoryOrCreate}}
        - {name: registration, hostPath: {path: {{ .Values.kubeletPath }}/plugins_registry, type: Directory}}
        - {name: kubelet, hostPath: {path: {{ .Values.kubeletPath }}, type: Directory}}
        - {name: local, hostPath: {path: {{ .Values.localPath }}, type: DirectoryOrCreate}}
        - name: backing
          persistentVolumeClaim: {claimName: {{ .Values.backingClaim }}}
